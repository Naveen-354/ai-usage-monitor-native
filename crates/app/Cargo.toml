[package]
name = "ai-usage-monitor-native"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ai-usage-monitor-native"
path = "src/main.rs"

[dependencies]
app-api = { path = "../app-api" }
native-ui = { path = "../ui" }
native-platform = { path = "../platform" }
fire-engine = { path = "../fire-engine" }
ai_usage_monitor_core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
