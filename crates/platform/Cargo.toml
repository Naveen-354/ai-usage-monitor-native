[package]
name = "native-platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
app-api = { path = "../app-api" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
tray-icon = "0.26.1"
global-hotkey = "0.8.0"
auto-launch = "0.6.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }
